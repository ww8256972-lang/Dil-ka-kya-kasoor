name: Deploy Zero-Bill AI Tutor & Auth Proxy — Firebase Cloud Functions

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-openai-proxy.yml'

permissions:
  contents: read

concurrency:
  group: firebase-functions-deploy-gen-lang-client-0309263247
  cancel-in-progress: false

jobs:
  deploy-zero-bill-ai-tutor-proxy:
    name: Secret Sync & Deploy streamInstituteAiTutor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install & Validate Cloud Functions Dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          node -c index.js

      - name: Verify Firebase Project & Required GitHub Secrets
        id: check_secrets
        env:
          HAS_GROQ_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_CF_GATEWAY: ${{ secrets.CF_AI_GATEWAY_URL != '' }}
          HAS_CF_TOKEN: ${{ secrets.CF_AI_TOKEN != '' }}
          HAS_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_PROJECT_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0309263247 != '' }}
        run: |
          if [ ! -f "firebase.json" ] || [ ! -f ".firebaserc" ]; then
            echo "::error::Missing firebase.json or .firebaserc in repository root."
            exit 1
          fi

          if [ "$HAS_GROQ_KEY" != "true" ] || [ "$HAS_CF_GATEWAY" != "true" ] || [ "$HAS_CF_TOKEN" != "true" ] || ( [ "$HAS_PRIMARY_SA" != "true" ] && [ "$HAS_PROJECT_SA" != "true" ] ); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Missing required GitHub Repository Secrets. Please set GROQ_API_KEY, CF_AI_GATEWAY_URL, CF_AI_TOKEN, and FIREBASE_SERVICE_ACCOUNT in Settings -> Secrets and variables -> Actions."
              exit 1
            else
              echo "::notice title=Cloud Function Deploy Skipped::Set GROQ_API_KEY, CF_AI_GATEWAY_URL, CF_AI_TOKEN, and FIREBASE_SERVICE_ACCOUNT in GitHub Repository Secrets to deploy streamInstituteAiTutor automatically."
              exit 0
            fi
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate Service Account, Sync Zero-Bill AI Secrets & Deploy streamInstituteAiTutor
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_AI_GATEWAY_URL: ${{ secrets.CF_AI_GATEWAY_URL }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          FIREBASE_SA_RAW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0309263247 }}
          PROJECT_ID: gen-lang-client-0309263247
        run: |
          set -euo pipefail
          SA_FILE="${RUNNER_TEMP}/firebase-service-account.json"
          trap 'rm -f "$SA_FILE"' EXIT

          # Support either raw JSON or base64-encoded service account JSON
          if printf '%s' "$FIREBASE_SA_RAW" | grep -q '"private_key"'; then
            printf '%s' "$FIREBASE_SA_RAW" > "$SA_FILE"
          else
            printf '%s' "$FIREBASE_SA_RAW" | tr -d '\n\r ' | base64 -d > "$SA_FILE"
          fi
          chmod 600 "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          # Store/rotate Zero-Bill AI secrets securely in Google Cloud Secret Manager (never printed to logs)
          printf '%s' "$GROQ_API_KEY" | npx --yes firebase-tools@latest functions:secrets:set GROQ_API_KEY \
            --project "$PROJECT_ID" \
            --data-file=- \
            --force \
            --non-interactive

          printf '%s' "$CF_AI_GATEWAY_URL" | npx --yes firebase-tools@latest functions:secrets:set CF_AI_GATEWAY_URL \
            --project "$PROJECT_ID" \
            --data-file=- \
            --force \
            --non-interactive

          printf '%s' "$CF_AI_TOKEN" | npx --yes firebase-tools@latest functions:secrets:set CF_AI_TOKEN \
            --project "$PROJECT_ID" \
            --data-file=- \
            --force \
            --non-interactive

          # Deploy all three production Cloud Functions in asia-east1 without touching Hosting or Firestore rules
          npx --yes firebase-tools@latest deploy \
            --only functions:streamInstituteAiTutor,functions:gradeExamSubmission,functions:issuePortalCustomToken \
            --project "$PROJECT_ID" \
            --force \
            --non-interactive
